name: 2pacf            # environment name, used by `conda activate 2pacf`
channels:
  - conda-forge        # where packages are downloaded from
dependencies:
  - python=3.14        # Python version
  - numpy              # arrays, used in every module
  - scipy              # cKDTree, integration, stats
  - pandas             # reading CSV catalogs
  - astropy            # FITS, WCS, cosmology, units
  - pyyaml             # reading parameters.yaml
  - ipykernel          # lets your notebooks use this environment
