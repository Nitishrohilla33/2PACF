# run:  python run_pipeline.py parameters.yaml                 (all z-bins in survey.z_bins, one after the other)
#       python run_pipeline.py parameters.yaml z7p5_9p5        (only the named z-bin(s))
# paths are relative to the project folder; {z_bin} and {z_drop} below follow the z-bin being run.

paths:
  footprint_mask: "inputs/depth_maps/CEERS_SkyCompleteness_zbins/CEERS_SkyCompleteness_zbins/ceers_footprint_starmask_native.fits"  # FOOTPRINT + STARMASK on the native 0.03" mosaic grid; its WCS places the randoms
  sky_map: "inputs/depth_maps/CEERS_SkyCompleteness_zbins/CEERS_SkyCompleteness_zbins/{z_bin}/ceers_skycompleteness_{z_bin}.fits"  # P(sky position, m_F277W) per layer
  real_catalog: "inputs/catalogue/candidates_450.fits"                # vetted catalogue (MEMBER = 1 is the final sample)
  segm_map: "inputs/survey/bundle_sextractor/detection/segmentation_total_binary.fits"
  valid_mask: null      # optional bool image for the randoms; do not combine one already masked by segmentation with blending_check: footprint
  completeness: "inputs/depth_maps/CEERS_SkyCompleteness_zbins/CEERS_SkyCompleteness_zbins/{z_bin}/ceers_skycompleteness_mocks_{z_bin}.fits"  # injected mocks -> C(M_UV, z_true)
  lf_table: inputs/lf/lf_table.csv    # Schechter UV LF vs z (real / interpolated / extrapolated), made by make_lf_table.py
  output_dir: "outputs/{z_bin}/"             # acf_results_*.csv (w(theta) per M bin)
  summary_dir: "summary/{z_bin}/"            # summary_*.yaml (A_w, r0, bias) and the run log
  random_catalog_dir: "random_catalogs/"

survey:
  z_bins:                # one entry per z-bin (key = name used in outputs/ and summary/); z_drop = centre of z_true
    # split at z_a = 9.0: the member density drops there (70 per dz = 0.5 at 8.5-9.0, 16 at 9.0-9.5), and
    # 8.0-9.0 holds most of the clustering signal (narrow photo-z). Neither window has a sky map of its own:
    #   completeness: built from both maps' mocks by make_zbin_mocks.py (L4 = L3 & Z_A in window, exact)
    #   sky map: nearest existing map, used for its spatial pattern only (sky_map_approx)
    z8p0_9p0:
      z_a: [8.0, 9.0]    # data: Z_A in [lo, hi)
      z_true: [7.5, 10.0] # randoms and N(z): true z range (mocks passing this window: 99% at z_true < 9.35)
      M_UV_bins: [[-25.0338500740141, -17.3978714456232]]     # absolute M_UV, bright -> faint, contiguous [lo, hi); current values are the min/max
      paths:
        completeness: "inputs/depth_maps/derived_zbins/{z_bin}/ceers_skycompleteness_mocks_{z_bin}.fits"
        sky_map: "inputs/depth_maps/CEERS_SkyCompleteness_zbins/CEERS_SkyCompleteness_zbins/z7p5_9p5/ceers_skycompleteness_z7p5_9p5.fits"  # L4 window 8.0-9.5
      sky_map_approx: true
    z9p0_13p5:
      z_a: [9.0, 13.5]
      z_true: [8.5, 14.5]
      M_UV_bins: [[-25.0338500740141, -17.3978714456232]]
      paths:
        completeness: "inputs/depth_maps/derived_zbins/{z_bin}/ceers_skycompleteness_mocks_{z_bin}.fits"
        sky_map: "inputs/depth_maps/CEERS_SkyCompleteness_zbins/CEERS_SkyCompleteness_zbins/z9p5_14p5/ceers_skycompleteness_z9p5_14p5.fits"  # L4 window 9.5-13.5
      sky_map_approx: true
    # previous bins (one per sky map, no approximation); uncomment to run them again
    # z7p5_9p5:            # header ZRANGE = 7.50-9.50, L4WINDOW = 8.00-9.50
    #   z_a: [8.0, 9.5]
    #   z_true: [7.5, 9.5]
    #   M_UV_bins: [[-25.0338500740141, -17.3978714456232]]
    # z9p5_14p5:           # header ZRANGE = 9.50-14.50, L4WINDOW = 9.50-13.50
    #   z_a: [9.5, 13.5]
    #   z_true: [9.5, 14.5]
    #   M_UV_bins: [[-25.0338500740141, -17.3978714456232]]
  z_col: Z_A             # photo-z column used for the z_a window
  ra_col: RA
  dec_col: DEC
  muv_col: MUV           # ABSOLUTE magnitude at 1500 A (best-fit template at Z_A)
  data_cuts:             # pandas query strings applied to the catalogue before binning
    - "MEMBER == 1"      # final vetted sample after inspection (173 of 450)
  min_galaxies: 10       # skip M bins with fewer sources

injection:
  random_seed: 42
  random_to_data_ratio: 1000    # few data galaxies: make DR/RR noise negligible
  layer: 4                    # sky-map layer: 4 = full selection with z_a inside the bin's window
  blending_check: none        # none: the map comes from injections into the real image, so blending losses are already in it (and no segmentation map here)
  stamp_padding: 9.0
  max_r_eff_px: 30            # drop size outliers from the FLUX_RADIUS distribution
  chunk: 500000
  max_chunks: 2000
  force_regenerate_random_catalog: True

selection:
  n_z_grid: 60
  n_M_grid: 60
  monotone_completeness: true

acf:
  theta_min_arcsec: 10.0  # log-spaced bins (linear bins biased the first bin by 1.8x)
  theta_max_arcsec: 500.0
  n_theta_bins: 3        # 20 -> 8: with 20-65 galaxies per bin most of 20 bins have DD = 0
  beta: 0.6
  n_bootstrap: 200
  min_RR_counts: 20
  min_DD_counts: 5        # drop theta bins with fewer data-data pairs (their bootstrap error is unreliable)
  photoz_sigma: 0.0            # keep 0: layer 4 already contains P(z_a in window | z_true), so N(z) is in true z over z_true
  contamination_fraction: 0.0  # interloper fraction f: A_w -> A_w / (1-f)^2

cosmology:
  H0: 67.8
  Om0: 0.308
  h: 0.678
  sigma8_0: 0.828
  Ob0: 0.0484            # baryon density, for the Eisenstein & Hu P(k) in halo_mass.py (Planck 2015)
  ns: 0.9677             # spectral index (Planck 2015)

halo:
  bias_model: tinker10   # b_h(M) for the halo mass: tinker10 (Tinker+10, M_200m) or smt01 (Sheth, Mo & Tormen 01)